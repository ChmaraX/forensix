# Weekly, grouped updates: one PR per ecosystem. The commit message prefixes
# make each PR title a valid Conventional Commit (commitlint-pr-title.yml),
# for example "chore(deps): bump the npm group across 1 directory with 3 updates".
# The cooldown waits 7 days after a version is published before it is proposed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /collector
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
