# Weekly, grouped updates: one PR per ecosystem. The commit message prefixes
# make each PR title a valid Conventional Commit (commitlint-pr-title.yml),
# for example "chore(deps): bump the npm group across 1 directory with 3 updates".
# The cooldown waits 7 days after a version is published before it is proposed.
# Major versions are ignored: they need code changes, so upgrade them by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # Monthly: a Collector update can change what the binary links, and the
  # safety tests then ask for a review.
  - package-ecosystem: gomod
    directory: /collector
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gomod:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
