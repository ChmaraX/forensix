name: analyzer

on:
  pull_request:
    branches: [v2, master]
  push:
    branches: [v2, master]

permissions:
  contents: read

jobs:
  # Required gate 1: three-platform full offline verification. `verify:full`
  # runs format:check, lint, typecheck, the vitest suite, and then the offline
  # verification harness (compiled CLI: ingest -> analyse -> export) on each OS.
  verify-full:
    name: verify:full / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      # The Collector -> Analyzer E2E (e2e/source-kinds-cli.test.ts) builds the
      # Go Collector; pin the same Go as the Collector workflow.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.mod
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      # The dashboard browser E2E (e2e/dashboard-browser.test.ts) must run on
      # Linux; elsewhere it skips with a message when Chromium is missing.
      - name: Install Chromium for the dashboard browser E2E
        if: runner.os == 'Linux'
        run: corepack pnpm exec playwright install --with-deps --only-shell chromium
      - name: Verify Analyzer (full, offline)
        env:
          FORENSIX_REQUIRE_BROWSER_E2E: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: corepack pnpm verify:full
      - name: Keep the dashboard browser E2E artifacts (traces, screenshots, Case)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-browser-e2e
          path: e2e/.artifacts/dashboard/
          if-no-files-found: ignore

  # Required gate 2: static analysis. Redundant with verify-full by design, so
  # a static regression is reported as its own required check.
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Format, lint, and type-check
        run: |
          corepack pnpm format:check
          corepack pnpm lint
          corepack pnpm typecheck

  # Required gate 3: supply chain. The lockfile must be frozen and free of
  # high-severity advisories in production dependencies.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install with a frozen lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Fail on lockfile drift
        run: git diff --exit-code pnpm-lock.yaml
      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level high

  # Required gate 4: bounded scale. The pipeline must process a mid-size History
  # within a settled wall-clock budget. The million-row case stays a manual
  # pre-release job (.github/workflows/scale-million.yml).
  scale:
    name: scale (bounded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Bounded scale gate (25k visits, 180s budget)
        run: corepack pnpm verify:scale 25000 180000

  # Release packaging DRY RUN. Runs the exact packaging path of the
  # analyzer-v* release (scripts/pack-analyzer.mjs: one self-contained
  # `forensix` package, version + git SHA stamped at pack time), then installs
  # the tarball offline into an empty directory and smokes the INSTALLED binary
  # (--version, skill get, ingest -> analyse -> history, serve). It publishes
  # NOTHING: no provenance attestation, no GitHub Release, no npm publish.
  # Those run only from the tag-triggered release-analyzer.yml workflow.
  package-dry-run:
    name: package (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build
        run: corepack pnpm build
      - name: Pack the forensix package with a placeholder version
        run: |
          set -euo pipefail
          node scripts/pack-analyzer.mjs --version 0.0.0-dryrun \
            --git-sha "$GITHUB_SHA" --out "$PWD/dist/analyzer"
      - name: Install the tarball offline and smoke the installed CLI
        run: |
          set -euo pipefail
          node scripts/smoke-analyzer-package.mjs \
            dist/analyzer/forensix-0.0.0-dryrun.tgz \
            --version 0.0.0-dryrun --git-sha "$GITHUB_SHA"
      - name: Checksum
        working-directory: dist/analyzer
        run: |
          set -euo pipefail
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS
