name: research-152-branded-chrome-cache-backend

on:
  workflow_dispatch: {}

jobs:
  windows-branded-cache:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install driver deps
        run: npm install puppeteer-core@23
        shell: bash
      - name: Install branded Google Chrome via winget
        shell: pwsh
        run: |
          # winget installs Chrome to Program Files by default
          winget install --id Google.Chrome --exact --silent --accept-package-agreements --accept-source-agreements
          # Give it a moment to complete
          Start-Sleep -Seconds 5
      - name: Locate chrome.exe
        id: chrome
        shell: pwsh
        run: |
          # Branded Chrome installs to Program Files
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromePath) {
            "path=$chromePath" >> $env:GITHUB_OUTPUT
            "Found Chrome at: $chromePath"
            & $chromePath --version
          } else {
            Write-Error "Chrome not found at expected path: $chromePath"
            exit 1
          }
      - name: Drive browsing session
        shell: bash
        run: node research/_raw/135-driver.js "${{ steps.chrome.outputs.path }}" "$PWD/udd"
      - name: Inspect Cache_Data and Local State
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $cacheDir = "udd\Default\Cache"
          $cacheData = "$cacheDir\Cache_Data"
          if (Test-Path $cacheDir) {
            Get-ChildItem $cacheDir -Recurse | Select FullName,Length,Mode | Out-File evidence\cache_tree_listing.txt
          } else {
            "Cache dir not found at $cacheDir" | Out-File evidence\cache_tree_listing.txt
          }
          if (Test-Path $cacheData) {
            Get-ChildItem $cacheData | Select Name,Length | Sort-Object Name | Out-File evidence\cache_data_listing.txt
            if (Test-Path "$cacheData\index") {
              Format-Hex "$cacheData\index" -Count 256 | Out-File evidence\index_hex.txt
            }
            # Check for SQL backend files
            Get-ChildItem $cacheData -Filter "sqldb*" | ForEach-Object {
              Format-Hex $_.FullName -Count 512 | Out-File "evidence\$($_.Name)_hex.txt"
            }
            # Check for blockfile backend files
            Get-ChildItem $cacheData -Filter "data_*" | ForEach-Object {
              Format-Hex $_.FullName -Count 512 | Out-File "evidence\$($_.Name)_hex.txt"
            }
            Get-ChildItem $cacheData -Filter "f_*" | Select-Object -First 5 | ForEach-Object {
              Format-Hex $_.FullName -Count 256 | Out-File "evidence\$($_.Name)_hex.txt"
            }
            # Check for Simple Cache backend files (16-hex filenames)
            Get-ChildItem $cacheData -Filter "*_0" | Select-Object -First 5 | ForEach-Object {
              Format-Hex $_.FullName -Count 256 | Out-File "evidence\simplecache_$($_.Name)_hex.txt"
            }
            if (Test-Path "$cacheData\index-dir") {
              Get-ChildItem "$cacheData\index-dir" | Select Name,Length | Out-File evidence\index_dir_listing.txt
              Get-ChildItem "$cacheData\index-dir" -File | ForEach-Object {
                Format-Hex $_.FullName -Count 256 | Out-File "evidence\indexdir_$($_.Name)_hex.txt"
              }
            }
          } else {
            "Cache_Data not found at $cacheData" | Out-File evidence\cache_data_listing.txt
          }
          Copy-Item "udd\Local State" evidence\local_state.json -ErrorAction SilentlyContinue
          Get-Content "udd\Local State" -ErrorAction SilentlyContinue |
            Select-String '"os_crypt"' -Context 0,3 | Out-File evidence\local_state_oscrypt_context.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-branded-cache-evidence
          path: evidence/**

  linux-branded-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install driver deps
        run: npm install puppeteer-core@23
      - name: Install branded Google Chrome via official .deb repository
        run: |
          # Add Google's official Chrome repository
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable
      - name: Locate chrome binary
        id: chrome
        run: |
          # Branded Chrome installs to /usr/bin/google-chrome
          chromePath="/usr/bin/google-chrome"
          if [ -f "$chromePath" ]; then
            echo "path=$chromePath" >> "$GITHUB_OUTPUT"
            echo "Found Chrome at: $chromePath"
            "$chromePath" --version
          else
            echo "Chrome not found at expected path: $chromePath"
            exit 1
          fi
      - name: Drive browsing session
        run: node research/_raw/135-driver.js "${{ steps.chrome.outputs.path }}" "$PWD/udd"
      - name: Inspect Cache_Data and Local State
        run: |
          set -x
          mkdir -p evidence
          cacheDir="udd/Default/Cache"
          cacheData="$cacheDir/Cache_Data"
          if [ -d "$cacheDir" ]; then
            find "$cacheDir" -maxdepth 3 -exec ls -la {} \; > evidence/cache_tree_listing.txt 2>&1
          fi
          if [ -d "$cacheData" ]; then
            ls -la "$cacheData" | sort > evidence/cache_data_listing.txt
            if [ -f "$cacheData/index" ]; then
              xxd -l 256 "$cacheData/index" > evidence/index_hex.txt
            fi
            # Check for SQL backend files
            for f in "$cacheData"/sqldb*; do
              [ -f "$f" ] && xxd -l 512 "$f" > "evidence/$(basename "$f")_hex.txt"
            done
            # Check for blockfile backend files
            for f in "$cacheData"/data_*; do
              [ -f "$f" ] && xxd -l 512 "$f" > "evidence/$(basename "$f")_hex.txt"
            done
            n=0
            for f in "$cacheData"/f_*; do
              [ -f "$f" ] || continue
              n=$((n+1)); [ $n -gt 5 ] && break
              xxd -l 256 "$f" > "evidence/$(basename "$f")_hex.txt"
            done
            # Check for Simple Cache backend files (16-hex filenames)
            n=0
            for f in "$cacheData"/*_0; do
              [ -f "$f" ] || continue
              basename=$(basename "$f")
              # Only process files with 16-char hex names (plus _0 suffix)
              if echo "$basename" | grep -qE '^[0-9a-f]{16}_0$'; then
                n=$((n+1)); [ $n -gt 5 ] && break
                xxd -l 256 "$f" > "evidence/simplecache_$basename.txt"
              fi
            done
          else
            echo "Cache_Data not found at $cacheData" > evidence/cache_data_listing.txt
          fi
          cp "udd/Local State" evidence/local_state.json 2>/dev/null || true
          grep -o '"os_crypt".\{0,300\}' "udd/Local State" > evidence/local_state_oscrypt_context.txt 2>/dev/null || true
          # Cookie prefix check
          python3 research/_raw/135-cookie-prefix.py > evidence/cookies_prefix.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-branded-cache-evidence
          path: evidence/**
