name: release-analyzer

# Called by release-please.yml for a release tag `v<version>`. It does not run
# on its own. Each release is gated by the full offline verification.
# scripts/pack-analyzer.mjs then packs ONE self-contained npm package,
# `forensix` (compiled CLI + bundled skill, with the core, server, and client
# builds as bundled dependencies), and stamps the tag version and git SHA into
# its package.json and dist/build-info.json. The tarball is installed offline
# and smoked before anything is published. It ships with checksums and a
# build-provenance attestation.
#
# Order: npm publish runs BEFORE the assets go on the draft release, and the
# caller publishes the draft only after this workflow succeeds. Both steps are
# idempotent: a rerun skips a version that npm already has and replaces the
# assets of a release that is still a draft.
#
# npm trusted publishing (OIDC): no NPM_TOKEN. npm accepts the OIDC token of
# the CALLING workflow, release-please.yml, which is the workflow configured as
# the trusted publisher on npmjs.com. npm adds provenance automatically.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (for example v2.0.0-alpha.1)
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: release analyzer (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      # The Collector -> Analyzer E2E in verify:full builds the Go Collector;
      # pin the same Go as the Collector workflow.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.mod

      - name: Resolve version and SHA
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/analyzer/forensix-$version.tgz" >> "$GITHUB_OUTPUT"
          # A prerelease (1.2.3-alpha.1) goes to the `next` dist-tag; a
          # release goes to `latest`.
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Full offline verification gate
        run: corepack pnpm verify:full

      - name: Pack the forensix package (version + git SHA from the tag)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/pack-analyzer.mjs --version "$VERSION" \
            --git-sha "$COMMIT" --out "$PWD/dist/analyzer"

      - name: Install the tarball offline and smoke the installed CLI
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.sha }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -euo pipefail
          node scripts/smoke-analyzer-package.mjs "$TARBALL" \
            --version "$VERSION" --git-sha "$COMMIT"

      # SHA256SUMS-analyzer, so it does not replace the Collector checksums on
      # the same release.
      - name: Generate checksums
        working-directory: dist/analyzer
        run: |
          set -euo pipefail
          sha256sum forensix-*.tgz > SHA256SUMS-analyzer
          cat SHA256SUMS-analyzer

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/analyzer/*.tgz"

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          current=$(npm --version)
          if node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$current"; then
            echo "npm $current supports trusted publishing."
          else
            npm install -g npm@11
            npm --version
          fi

      # Publish the exact tarball that was smoked and attested. A rerun after a
      # later failure finds the version on npm and skips the publish.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -euo pipefail
          if published=$(npm view "forensix@$VERSION" version 2>/dev/null) \
            && [ "$published" = "$VERSION" ]; then
            echo "forensix@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm publish "$TARBALL" --access public --tag "$DIST_TAG"

      # Immutable releases: assets can change only while the release is a draft.
      - name: Attach the tarball and checksums to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "$TAG is already published; its assets cannot change."
            exit 0
          fi
          gh release upload "$TAG" dist/analyzer/forensix-*.tgz \
            dist/analyzer/SHA256SUMS-analyzer --clobber
