name: release-analyzer

# The analyzer publishes on its own SemVer line and tag prefix `analyzer-v*`,
# independently of the Collector (issue #188, AC5). Each release is gated by the
# full offline verification. scripts/pack-analyzer.mjs then packs ONE
# self-contained npm package, `forensix` (compiled CLI + bundled skill, with the
# core, server, and client builds as bundled dependencies), and stamps the tag
# version and git SHA into its package.json and dist/build-info.json. The
# tarball is installed offline and smoked before anything is published. It
# ships with checksums and a build-provenance attestation (AC6).
#
# Order: npm publish (only when an NPM_TOKEN secret is present) runs BEFORE the
# GitHub Release, so a failed publish leaves no partial release. Both steps are
# idempotent: a rerun skips a version that npm already has and updates the
# assets of a GitHub Release that already exists.
#
# This workflow triggers ONLY on a matching tag push. Opening or merging a PR
# never runs it, so merging this PR publishes nothing. The packaging path is
# still validated on every PR by the `package-dry-run` job in analyzer.yml.
on:
  push:
    tags:
      - "analyzer-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release analyzer (npm)
    runs-on: ubuntu-latest
    env:
      # Job-level so the publish step's `if` (evaluated in job context) can see it.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Resolve version and SHA
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#analyzer-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/analyzer/forensix-$version.tgz" >> "$GITHUB_OUTPUT"
          # A prerelease (1.2.3-beta.1) goes to the `next` dist-tag and is
          # marked as a prerelease on GitHub; a release goes to `latest`.
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Full offline verification gate
        run: corepack pnpm verify:full

      - name: Pack the forensix package (version + git SHA from the tag)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/pack-analyzer.mjs --version "$VERSION" \
            --git-sha "$COMMIT" --out "$PWD/dist/analyzer"

      - name: Install the tarball offline and smoke the installed CLI
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.sha }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -euo pipefail
          node scripts/smoke-analyzer-package.mjs "$TARBALL" \
            --version "$VERSION" --git-sha "$COMMIT"

      - name: Generate checksums
        working-directory: dist/analyzer
        run: |
          set -euo pipefail
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/analyzer/*.tgz"

      # Publish the exact tarball that was smoked and attested. A rerun after a
      # later failure finds the version on npm and skips the publish.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -euo pipefail
          if published=$(npm view "forensix@$VERSION" version 2>/dev/null) \
            && [ "$published" = "$VERSION" ]; then
            echo "forensix@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.sha }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(dist/analyzer/*.tgz dist/analyzer/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "Analyzer $VERSION" \
            --notes "Analyzer $VERSION ($COMMIT). The \`forensix\` npm package tarball with checksums and a provenance attestation. Install: \`npm i -g forensix@$VERSION\`, or \`npm i -g ./forensix-$VERSION.tgz\` from the attached tarball." \
            "${assets[@]}"
