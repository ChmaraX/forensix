name: research-152-windows-controlled-cache-backend

# Controlled re-run of the Windows half of #152. The prior windows-latest run
# (research-152.yml) is VOID, not negative evidence: it never verified Chrome
# actually browsed anything, so a silent driver failure and "no cache backend
# in use" would look identical. This run adds a positive control (History row
# counts) and does not assume the cache path — it scans recursively for all
# three backend signatures instead of only checking Default\Cache\Cache_Data.

on:
  workflow_dispatch: {}

jobs:
  windows-controlled-cache:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install branded Google Chrome via winget
        shell: pwsh
        run: |
          winget install --id Google.Chrome --exact --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 5

      - name: Locate chrome.exe and record version/architecture
        id: chrome
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $candidates = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chromePath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chromePath) {
            Write-Error "Chrome not found in any expected location"
            exit 1
          }
          "path=$chromePath" >> $env:GITHUB_OUTPUT
          $installDir = if ($chromePath -like "*Program Files (x86)*") { "Program Files (x86) — 32-bit install" } else { "Program Files — 64-bit install" }
          $version = & $chromePath --version
          @"
          chrome_path=$chromePath
          chrome_arch_dir=$installDir
          chrome_version_output=$version
          os_version=$([System.Environment]::OSVersion.VersionString)
          "@ | Out-File evidence\chrome_version_and_arch.txt
          Get-Content evidence\chrome_version_and_arch.txt

      - name: Drive headed, two-launch, persistent-profile browsing session
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path udd | Out-Null
          & "research/_raw/152-windows-driver.ps1" `
            -ChromePath "${{ steps.chrome.outputs.path }}" `
            -UserDataDir "$PWD\udd" `
            -EvidenceDir "$PWD\evidence"

      - name: POSITIVE CONTROL — verify Chrome actually browsed (History row counts)
        shell: pwsh
        run: |
          python research/_raw/152-history-check.py "$PWD\udd" | Tee-Object -FilePath evidence\history_positive_control.json

      - name: Full directory listing of user-data-dir (no path assumptions)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "udd" -File | Select-Object FullName, Length | Out-File evidence\udd_full_listing.txt
          if (Test-Path "$env:LOCALAPPDATA\Google\Chrome") {
            Get-ChildItem -Recurse "$env:LOCALAPPDATA\Google\Chrome" -File -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-File evidence\localappdata_chrome_listing.txt
          } else {
            "No $env:LOCALAPPDATA\Google\Chrome directory exists (expected — --user-data-dir was forced to udd)" | Out-File evidence\localappdata_chrome_listing.txt
          }

      - name: Recursive signature scan for all three cache backends
        shell: pwsh
        run: |
          $localAppDataChrome = "$env:LOCALAPPDATA\Google\Chrome"
          python research/_raw/152-cache-scan.py "$PWD\udd" "$localAppDataChrome" | Tee-Object -FilePath evidence\cache_signature_scan.json

      - name: Hex-dump any index files found, if any
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "udd" -Filter "index" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Format-Hex $_.FullName -Count 256 | Out-File "evidence\hexdump_$($_.Directory.Name)_index.txt"
          }
          Get-ChildItem -Recurse "udd" -Filter "the-real-index" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Format-Hex $_.FullName -Count 512 | Out-File "evidence\hexdump_the-real-index.txt"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-controlled-cache-evidence
          path: evidence/**
