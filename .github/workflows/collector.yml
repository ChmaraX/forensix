name: collector

on:
  pull_request:
    branches: [main]
    paths:
      - "collector/**"
      - "contracts/manifest/**"
      - "contracts/acquisition-bundle/**"
      - "contracts/selection-policy.chrome-userdata-1.json"
      - ".github/workflows/collector.yml"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "contracts/manifest/**"
      - "contracts/acquisition-bundle/**"
      - "contracts/selection-policy.chrome-userdata-1.json"
      - ".github/workflows/collector.yml"

permissions:
  contents: read

jobs:
  test:
    name: collector / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.mod
      - name: Test
        working-directory: collector
        run: go test ./...
      - name: Vet
        working-directory: collector
        run: go vet ./...

  race-and-cross-build:
    name: collector / race and six release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.mod
      - name: Race detector
        working-directory: collector
        run: go test -race ./...
      - name: Cross-build static binaries
        working-directory: collector
        shell: bash
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -o "/tmp/forensix-collect-$os-$arch$suffix" ./cmd/forensix-collect
          done
