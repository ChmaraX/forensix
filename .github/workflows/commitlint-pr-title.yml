name: commitlint-pr-title

# Squash-merge promotes the PR title to the commit that lands on main, so the
# title itself must be a valid Conventional Commit. This job lints it.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint-pr-title:
    name: commitlint-pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Lint PR title as a Conventional Commit
        env:
          # Pass the untrusted title via env, never interpolated into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | corepack pnpm exec commitlint
