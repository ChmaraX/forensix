name: research-153-linux-oscrypt-live-secret-service

on:
  workflow_dispatch: {}

jobs:
  linux-secret-service-v11:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, kde]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install driver deps
        run: npm install puppeteer-core@23 @puppeteer/browsers@2
      - name: Install Chrome for Testing
        run: npx @puppeteer/browsers install chrome@stable --path chrome
      - name: Install GNOME desktop components
        if: matrix.desktop == 'gnome'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gnome-keyring \
            dbus-x11 \
            libsecret-1-0 \
            libsecret-tools \
            xvfb \
            fluxbox
      - name: Install KDE desktop components
        if: matrix.desktop == 'kde'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            kwalletmanager \
            dbus-x11 \
            xvfb \
            fluxbox
      - name: Start Xvfb and desktop session (GNOME)
        if: matrix.desktop == 'gnome'
        run: |
          # Start Xvfb on display :99
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          
          # Start a minimal window manager so we have a "desktop session"
          fluxbox &
          sleep 2
          
          # Set GNOME desktop environment variables
          echo "XDG_CURRENT_DESKTOP=GNOME" >> "$GITHUB_ENV"
          echo "DESKTOP_SESSION=gnome" >> "$GITHUB_ENV"
          echo "GNOME_DESKTOP_SESSION_ID=this-is-deprecated-but-set-anyway" >> "$GITHUB_ENV"
          
          # Start D-Bus session
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          
          # Start gnome-keyring-daemon with empty password, unlocked
          mkdir -p ~/.local/share/keyrings
          printf '\n' | gnome-keyring-daemon --components=secrets,pkcs11 --unlock --daemonize
          sleep 2
          
          # Verify keyring is running and accessible
          ps aux | grep gnome-keyring || echo "gnome-keyring-daemon not found in ps"
          secret-tool store --label='test' test test || echo "secret-tool test store failed"
      - name: Start Xvfb and desktop session (KDE)
        if: matrix.desktop == 'kde'
        run: |
          # Start Xvfb on display :99
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          
          # Start a minimal window manager
          fluxbox &
          sleep 2
          
          # Set KDE desktop environment variables
          echo "XDG_CURRENT_DESKTOP=KDE" >> "$GITHUB_ENV"
          echo "DESKTOP_SESSION=kde" >> "$GITHUB_ENV"
          echo "KDE_FULL_SESSION=true" >> "$GITHUB_ENV"
          
          # Start D-Bus session
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          
          # Start kwalletd5 - create an empty wallet with no password
          # Note: kwalletd may require more setup, this is a minimal attempt
          dbus-send --print-reply --session \
            --dest=org.kde.kwalletd5 \
            /modules/kwalletd5 \
            org.kde.KWallet.open string:'kdewallet' int64:0 string:'forensix' || echo "kwalletd5 start attempt (may fail)"
          sleep 2
      - name: Locate chrome binary
        id: chrome
        run: |
          exe=$(find chrome -type f -name chrome | head -1)
          echo "path=$exe" >> "$GITHUB_OUTPUT"
      - name: Drive browsing session
        run: node research/_raw/153-driver.js "${{ steps.chrome.outputs.path }}" "$PWD/udd"
      - name: Inspect results (cookies prefix, Local State, keyring)
        run: |
          set -x
          mkdir -p evidence
          
          # Cookies ciphertext prefix - the key evidence for v10 vs v11
          python3 research/_raw/135-cookie-prefix.py > evidence/cookies_prefix.txt 2>&1
          
          # Local State os_crypt section
          cp "udd/Local State" evidence/local_state.json 2>/dev/null || echo "Local State not found"
          grep -o '"os_crypt".\{0,500\}' "udd/Local State" > evidence/local_state_oscrypt_context.txt 2>/dev/null || echo "No os_crypt section found"
          
          # Full Local State for inspection
          cat "udd/Local State" | python3 -m json.tool > evidence/local_state_formatted.json 2>/dev/null || true
          
          # Desktop environment verification
          echo "XDG_CURRENT_DESKTOP: $XDG_CURRENT_DESKTOP" > evidence/env_vars.txt
          echo "DESKTOP_SESSION: $DESKTOP_SESSION" >> evidence/env_vars.txt
          echo "DISPLAY: $DISPLAY" >> evidence/env_vars.txt
          if [ "${{ matrix.desktop }}" = "gnome" ]; then
            echo "GNOME_DESKTOP_SESSION_ID: $GNOME_DESKTOP_SESSION_ID" >> evidence/env_vars.txt
            # Check if anything was stored in gnome-keyring
            secret-tool search test test >> evidence/keyring_test.txt 2>&1 || echo "secret-tool search failed"
          fi
          if [ "${{ matrix.desktop }}" = "kde" ]; then
            echo "KDE_FULL_SESSION: $KDE_FULL_SESSION" >> evidence/env_vars.txt
          fi
          
          # Process list to confirm services were running
          ps aux | grep -E "(gnome-keyring|kwallet|dbus)" > evidence/process_list.txt
          
          # Cache structure (minimal, just to confirm it ran)
          cacheData="udd/Default/Cache/Cache_Data"
          if [ -d "$cacheData" ]; then
            ls -la "$cacheData" > evidence/cache_data_listing.txt
          else
            echo "Cache_Data not found" > evidence/cache_data_listing.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-secret-service-evidence-${{ matrix.desktop }}
          path: evidence/**
