name: release-collector

# Called by release-please.yml for a release tag `v<version>`. It does not run
# on its own. The Collector shares the product version line. Each release
# attaches six raw static Go binaries with checksums and build-provenance
# attestations to the draft release. The version and git SHA of the tag are
# injected at build time.
#
# A rerun replaces the assets of a release that is still a draft. The six-target
# build is also validated on every PR by `race-and-cross-build` in collector.yml.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (for example v2.0.0-alpha.1)
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: release collector binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.mod

      - name: Resolve version and SHA
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test and vet before release
        working-directory: collector
        run: |
          go test ./...
          go vet ./...

      - name: Cross-build six static binaries with injected version + SHA
        working-directory: collector
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../dist/collector
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            out="../dist/collector/forensix-collect-${VERSION}-${os}-${arch}${suffix}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/forensix-collect
          done

      # SHA256SUMS-collector, so it does not replace the analyzer checksums on
      # the same release.
      - name: Generate checksums
        working-directory: dist/collector
        run: |
          set -euo pipefail
          sha256sum forensix-collect-* > SHA256SUMS-collector
          cat SHA256SUMS-collector

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/collector/forensix-collect-*"

      # Immutable releases: assets can change only while the release is a draft.
      - name: Attach the binaries and checksums to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "$TAG is already published; its assets cannot change."
            exit 0
          fi
          gh release upload "$TAG" dist/collector/forensix-collect-* \
            dist/collector/SHA256SUMS-collector --clobber
