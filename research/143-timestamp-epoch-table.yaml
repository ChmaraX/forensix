# ===== Sessions / Tabs (SNSS) ==========================================

- id: sessions/filename/timestamp_suffix
  artifact: Sessions
  table: "(filename)"
  column: "numeric suffix of Session_<N> / Tabs_<N>"
  kind: timestamp
  claim_state: verified
  epoch:
    - {version_range: {min: 3, max: 5}, platform: any, family: win1601_us, basis: verified,
       version_field: "SNSS header version (NOT meta.version)",
       note: "1601-us at header v3 and v5 alike. The header version bounds DECRYPTABILITY, not epoch.",
       source: {ref: ba3c200, path: components/sessions/core/command_storage_backend.cc, lines: "70-77, 570-587, 704"}}
  semantics: "the moment the file was created, i.e. session start"
  integrity_warning:
    forcibly_monotonic: true
    detail: >-
      If the system clock goes backwards (NTP correction, user change, VM snapshot restore) Chrome
      does NOT write the real time — it writes previous + 1 microsecond. The filename timestamp is
      an upper-bounded lie in exactly the scenario an examiner cares most about.
    detector: {rule: "a run of session files whose timestamps differ by exactly 1 us", yields: "positive signal that the host clock was set backwards", basis: verified, emit_as: candidate,
               note: "Nothing else in the profile records this. HIGH VALUE — escalate to the integrity model."}
    source: {ref: ba3c200, path: components/sessions/core/command_storage_backend.cc, lines: "728-742"}
  provenance:
    - {ref: ba3c200, path: components/sessions/core/command_storage_backend.cc, lines: "89-94", claim: "filename = base name + kTimestampSeparator + timestamp string"}

- id: sessions/SerializedNavigationEntry/timestamp
  artifact: Sessions
  table: SerializedNavigationEntry
  column: timestamp
  kind: timestamp
  claim_state: verified
  on_disk_shape: "raw little-endian int64 in the pickle body (ToInternalValue())"
  epoch:
    - {version_range: {min: 3, max: 5}, platform: any, family: win1601_us, basis: verified,
       version_field: "SNSS header version",
       source: {ref: ba3c200, path: components/sessions/core/serialized_navigation_entry.cc, lines: "148, 221-225"}}
  forensic_value: "The per-navigation time — the closest thing SNSS has to a history entry, and it survives in Last Session / Last Tabs AFTER History has been cleared."
  parser_hazards:
    - "The pickle has NO field tags: it is POSITIONAL. The timestamp is the 12th field, after is_overriding_user_agent_."
    - "Field 9 is written as a hardcoded obsolete value (kObsoleteReferrerPolicyNever) and field 13 (search_terms_) was removed but is still written as an empty string to hold its slot. A parser that 'cleans up' these dead fields desynchronises and reads the WRONG int64 as the timestamp."
  sentinels:
    - {raw: 0, means: "read failure on a short/truncated pickle — render as unknown, never 1601", emit_as: unavailable, basis: verified,
       source: {ref: ba3c200, path: components/sessions/core/serialized_navigation_entry.cc, lines: "221-225"}}
  provenance:
    - {ref: ba3c200, path: components/sessions/core/serialized_navigation_entry.cc, lines: "95-114", claim: "documented positional field order"}

