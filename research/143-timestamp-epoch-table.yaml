    - {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "772-778", claim: "guard at cur_version == 23, not platform-conditional"}

- id: history/downloads/end_time
  artifact: History
  table: downloads
  column: end_time
  kind: timestamp
