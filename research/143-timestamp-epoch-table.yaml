# ===== Extension State =================================================

- id: extension-state/-/-
  artifact: Extension State
  table: null
  column: null
  kind: no_timestamp_columns
  claim_state: inferred
  verified_absent: false
  emit_as: unavailable
  reason: >-
    Chrome imposes NO schema on this LevelDB and writes no timestamp of its own; values are
    base::Value JSON blobs supplied by the extension under extension-chosen keys. Any timestamp
    found here is EXTENSION-AUTHORED and can be in any format — most commonly Date.now() =>
    Unix MILLISECONDS, because the writer is JavaScript. DO NOT apply Chrome's epoch conventions.
    An 18-digit integer here is far more likely a JS microsecond value or an ID than 1601-us.
  claim_state_note: "The reasoning is stated as INFERRED because the store implementation (extensions/browser/api/storage/) was NOT read during the #143 run."
  verification_queue: "part 4 U14"
  only_chrome_controlled_times: "LevelDB-level SST file mtimes and MANIFEST sequence — filesystem/format metadata, not content."
  provenance:
    - {ref: ba3c200, path: extensions/browser/api/storage/, lines: not-read, claim: "explicitly not read during the #143 run"}

# ---------------------------------------------------------------------------
# Cross-cutting registers, derived from the rows above. Redundant with the rows
# by design: a consumer can load one register without walking every row.
# ---------------------------------------------------------------------------

registers:

  name_collisions:
    entries:
    - {name: date_created, members: ["logins.date_created (version-dependent unix_s/win1601_us)", "autofill.date_created (unix_s)", "password_notes.date_created (win1601_us)"],
       rule: "NEVER key a decoder on the column NAME. Key on (artifact, table, column, meta.version)."}
    - {name: use_date, members: ["credit_cards.use_date (unix_s)", "local_ibans.use_date (unix_s)", "server_card_metadata.use_date (win1601_us)", "masked_ibans_metadata.use_date (win1601_us)", "valuables_metadata.use_date (win1601_us)", "addresses.use_date (unix_s)", "autofill_ai_entities_metadata.use_date (win1601_us)"],
       rule: "Same name, same file, same semantic, both INTEGER NOT NULL DEFAULT 0. Both wrong decodings fail loudly — but only if the tool tries."}

  magnitude_fallback:
    status: defeated
    defeated_by: web-data/offer_data/expiry
    rule: "The magnitude heuristic may only ever produce a Candidate, never a Finding, and can never be the sole resolver."
    digit_table:
      - {digits: 10, family: unix_s, value_2026: 1.7e9}
      - {digits: 11, family: win1601_s, value_2026: 1.34e10}
      - {digits: 13, family: win1601_ms, value_2026: 1.34e13, collides_with: "Unix milliseconds — SAME digit count"}
      - {digits: 16, family: unix_us, value_2026: 1.7e15}
      - {digits: 18, family: win1601_us, value_2026: 1.34e17}

  requires_os_input:
    entries:
      - {rows: [history/urls/last_visit_time, history/visits/visit_time, history/segment_usage/time_slot], applies_when: "History meta.version <= 16"}
      - {rows: [cookies/cookies/creation_utc, cookies/cookies/expires_utc, cookies/cookies/last_access_utc], applies_when: "Cookies meta.version <= 3"}
    note: "The originating OS is NOT recorded in any Chrome artifact. It is an operator input. Without it the Field State is 'unavailable', never a guessed value."

  synthetic_timestamps:
    entries:
      - {row: login-data/logins/date_password_modified, records: "backfilled = date_created for pre-v30 rows"}
      - {row: login-data/insecure_credentials/create_time, records: "base::Time::Now() at migration time for v29-v31 zeros — evidences a Chrome UPGRADE"}
      - {row: cookies/cookies/expires_utc, records: "possibly the v19 +400d cap, not the server-sent expiry"}
      - {row: secure-preferences/extensions/first_install_time, records: "both first_install_time and last_update_time backfilled from the one legacy install_time"}
      - {row: bookmarks/node/date_added, records: "Time::Now() at first parse when the key was missing"}
      - {row: bookmarks/folder/date_modified, records: "Time::Now() at first parse when the key was missing"}
    rule: "A synthetic value decodes CORRECTLY and is still false as evidence. The resolver must carry a synthetic flag alongside the epoch family."

  json_shape_is_not_epoch:
    rule: >-
      A quoted decimal string in a Chrome JSON artifact carries NO epoch information whatsoever.
      base::Int64ToValue is the only stringifier and it is epoch-agnostic; SetTime (1601-us),
      SetInt64 (often ToTimeT = Unix seconds) and SetUint64 all emit an indistinguishable shape,
      and TimeDeltaToValue emits the same shape for a DURATION.
    confirmed_unsafe: "#125's 'quoted string => 1601-us' heuristic, unsafe BY CONSTRUCTION."
    only_in_band_discriminator: magnitude
    dispositive_out_of_band_signal: "the pref REGISTRATION in source (RegisterTimePref vs RegisterInt64Pref) — compile-time only, not on disk"
    read_path_trap: "ValueToInt64 requires value.is_string(). A tool that normalises a time to a JSON NUMBER does not lose precision — Chrome silently treats the key as ABSENT."
    source: {ref: ba3c200, path: base/json/values_util.cc, lines: "37, 46-56, 58, 74, 82-88"}

  declared_timezone_leaks:
    entries:
      - {row: history/segment_usage/time_slot, mechanism: "LocalMidnight() on the write path; a UTC container holding a locally derived value", strength: strongest, basis_of_offset_recovery: inferred}
      - {row: preferences/site_engagement/lastEngagementTime, mechanism: "adjacent pointsAddedToday is bucketed by the host's local day", basis_of_offset_recovery: inferred}
    note: "#125's HIGH-confidence claim 'all Chrome timestamps are UTC; no artifact stores wall-clock local time' is FALSIFIED by segment_usage.time_slot. Declared Timezone remains an operator input; these leaks produce Candidates only."
