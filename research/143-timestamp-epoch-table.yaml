  boundary: {from_version: 23, to_version: 24, migration_fn: MigrateDownloadsReasonPathsAndDangerType, first_stable_milestone: M26, stable_date: "2013-03-26", milestone_basis: "release-tag bisection: absent at 25.0.1364.172, present at 26.0.1410.43"}
