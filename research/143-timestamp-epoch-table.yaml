# ForensiX — machine-readable Chrome timestamp epoch table
# Lane B deliverable for issue #145 ("does the per-column epoch table live in code or in data?").
#
# Derived ONLY by transcription from:
#   research/143-timestamp-epoch-version-matrix.md
#   research/_raw/143-part-1-history.md
#   research/_raw/143-part-2-credentials.md
#   research/_raw/143-part-3-webdata.md
#   research/_raw/143-part-4-json-and-misc.md
# No new research was performed. Where the sources disagree or are silent the row is
# marked claim_state: unresolved and carries no epoch guess.
#
# Vocabulary is CONTEXT.md's: Source, Working Copy, Manifest, Provenance, Field State
# (value/absent/unavailable), Candidate, Finding, Epoch Family, Declared Timezone,
# Commit State, Sidecar.
#
# Design notes and coverage: research/_raw/143-epoch-table-NOTES.md

meta:
  schema_version: 1
  issue: 145
  derives_from_issue: 143
  status: derived-transcription
  generated_by: lane-B transcription pass (no source fetches)
  chrome_stable_at_source_run: "151.0.7922.77 (M151)"
  source_refs:
    cb211f6:
      repo: chromium/src
      sha: cb211f647e4138888643a909973b2d07d49ae79c
      note: parent of ba3c200, one autoroll commit apart; line numbers comparable
      used_by: [143-part-1-history.md, 143-part-2-credentials.md]
    ba3c200:
      repo: chromium/src
      sha: ba3c200c1564977873107f5656c015253ba129b1
      note: refs/heads/main at time of the #143 run
      used_by: [143-part-3-webdata.md, 143-part-4-json-and-misc.md]
    tag_120:
      repo: chromium/src
      ref: refs/tags/120.0.6099.71
      note: last release that shipped Media History
  known_gaps:
    - "Gitiles +log / +blame return HTTP 401 unauthenticated, so no row carries a CL number or commit date."
    - "Milestone pins are 'first stable milestone whose branch point already contained the bump' — accurate to within one milestone."

# ---------------------------------------------------------------------------
# Controlled vocabularies. A parser MUST reject any value not listed here.
# ---------------------------------------------------------------------------

epoch_families:
  win1601_us:
    name: 1601-microseconds
    definition: microseconds since 1601-01-01T00:00:00Z
    producing_api: "sql::Statement::BindTime / base::Time::ToDeltaSinceWindowsEpoch().InMicroseconds() / base::TimeToValue"
    digits_in_2026: 18
    magnitude_in_2026: 1.34e17
  win1601_ms:
    name: 1601-milliseconds
    definition: milliseconds since 1601-01-01T00:00:00Z
    producing_api: "base::Time::ToDeltaSinceWindowsEpoch().InMilliseconds()"
    digits_in_2026: 13
    magnitude_in_2026: 1.34e13
    hazard: "Same digit count as Unix milliseconds. The magnitude heuristic does NOT disambiguate it; a naive Unix-ms decode yields a plausible date in 2394."
  win1601_s:
    name: 1601-seconds
    definition: seconds since 1601-01-01T00:00:00Z
    producing_api: "base::Time::ToDeltaSinceWindowsEpoch().InSeconds()"
    digits_in_2026: 11
    magnitude_in_2026: 1.34e10
    hazard: "Decoding as 1601-us yields 1601-01-01T03:43 — plausible-looking garbage."
  unix_s:
    name: Unix-seconds
    definition: seconds since 1970-01-01T00:00:00Z
    producing_api: "base::Time::ToTimeT() / PrefService::SetInt64 with ToTimeT()"
    digits_in_2026: 10
    magnitude_in_2026: 1.7e9
  unix_us:
    name: Unix-microseconds
    definition: microseconds since 1970-01-01T00:00:00Z
    producing_api: "pre-migration state only; no live write site in Chromium"
    digits_in_2026: 16
    magnitude_in_2026: 1.7e15
  json_double_win1601_us:
    name: 1601-microseconds-as-IEEE754-double
    definition: "win1601_us written as an unquoted JSON number via static_cast<double>"
    producing_api: "base::Value(double) from Time::ToInternalValue()"
    hazard: "Exceeds 2^53; quantised to a 16 us grid. Precision loss is by design and confirmed."
  unresolved:
    name: unresolved
    definition: "The #143 evidence does not determine the family. Never guess; emit Field State unavailable."

kinds:
  timestamp: "An absolute instant. Decode with the row's epoch rules."
  duration: "An elapsed interval. Same on-disk shape as a timestamp in several places. NEVER date-render."
  not_a_timestamp: "Looks like a time by name or type and is not (HTTP header string, card expiry month, media playhead, enum, generic int)."
  no_timestamp_columns: "Verified negative: the whole table/artifact was read and has no time column. Distinct from 'we did not look'."

claim_states:
  verified: "Read from Chromium source during the #143 run; cited file:line in provenance."
  inferred: "Reasoned from a verified fact but not itself read. Never a Finding on its own."
  unresolved: "Not determined by the #143 evidence. Emit Field State unavailable with the stated reason."

# Maps a resolution outcome onto CONTEXT.md's Field State.
field_state_mapping:
  epoch_resolved_and_value_present: value
  sentinel_matched: absent
  key_or_column_absent: absent
  verified_negative_claim: absent
  epoch_unresolved: unavailable
  requires_operator_input_not_supplied: unavailable

# First-class ambiguity states. #143's central finding is that meta.version is not a
# sufficient discriminator; these name the ways it fails.
ambiguity_states:
  requires_os_input:
    description: "Epoch depends on the ORIGINATING OS of the profile. No Chrome artifact records it."
    resolution_inputs: [originating_os]
    emit_when_unsupplied: unavailable
  version_field_untrusted:
    description: "meta.version on disk can be wrong; Chrome repairs it by column sniffing (FixVersionIfNeeded)."
    resolution_inputs: [column_presence_sniff, magnitude_check]
  unresolved_source_deleted:
    description: "The migration body no longer exists at the read ref; the pre-migration encoding was not recovered."
    emit_when_unsupplied: unavailable
  not_examined:
    description: "In scope but not read during the #143 run. 'We did not look' — never 'there is nothing'."
    emit_when_unsupplied: unavailable

platforms: [any, windows, non_windows]

# ---------------------------------------------------------------------------
# Artifacts. Version-field character, and the destructive-open hazards that make
# the Working Copy contract (#121) non-negotiable.
# ---------------------------------------------------------------------------

artifacts:
  History:
    container: sqlite
    version_field: meta.version
    current_version: 70
    compatible_version: 16
    minimal_version: 15
    razes_below: 15
    raze_note: "RazeDbIfTooOld() destroys a DB below v15 when kRazeOldHistoryDatabase is enabled."
    source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "42-45, 98-124"}
  Top Sites:
    container: sqlite
    version_field: meta.version
    version_constant: kVersionNumber
    current_version: 5
    razes_below: 4
    source: {ref: cb211f6, path: components/history/core/browser/top_sites_database.cc, lines: "58-59, 203-262"}
  Favicons:
    container: sqlite
    version_field: meta.version
    current_version: 9
    compatible_version: 9
    razes_below: 8
    source: {ref: cb211f6, path: components/favicon/core/favicon_database.cc, lines: "94-116"}
  Shortcuts:
    container: sqlite
    version_field: meta.version
    current_version: 2
    compatible_version: 1
    note: "v0 has no meta table at all; a missing meta table is not corruption here."
    source: {ref: cb211f6, path: components/omnibox/browser/shortcuts_database.cc, lines: "30-31, 320-330"}
  Network Action Predictor:
    container: sqlite
    version_field: none
    note: "No version constant and no migration ladder. Table name is network_action_predictor."
    source: {ref: cb211f6, path: chrome/browser/predictors/autocomplete_action_predictor_table.cc, lines: "22, 217-226"}
  Login Data:
    container: sqlite
    version_field: meta.version
    current_version: 43
    compatible_version: 40
    version_field_trustworthy: false
    version_field_note: "FixVersionIfNeeded repairs a wrong meta.version by column sniffing (crbug.com/295851). See ambiguity_states.version_field_untrusted."
    also_applies_to: [Login Data For Account]
    source: {ref: cb211f6, path: components/password_manager/core/browser/password_store/login_database.cc, lines: "80, 83, 914-950"}
  Cookies:
    container: sqlite
    path_in_profile: Network/Cookies
    version_field: meta.version
    current_version: 24
    compatible_version: 24
    razes_below: 23
    also_applies_to: [Extension Cookies]
    also_applies_to_state: unresolved
    also_applies_to_note: "Extension Cookies is the same writer if it still exists; existence not confirmed (part 4 U4, part 2 V-9)."
    source: {ref: cb211f6, path: net/extras/sqlite/sqlite_persistent_cookie_store.cc, lines: "316-317, 1121-1203"}
  DIPS:
    container: sqlite
    aka: BTM
    version_field: meta.version
    current_version: 11
    compatible_version: 11
    razes_unless_exactly: 11
    source: {ref: cb211f6, path: content/browser/btm/btm_database.h, lines: "39-45"}
  Web Data:
    container: sqlite
    version_field: meta.version
    current_version: 153
    compatible_version: 151
    deprecated_version: 82
    razes_below: 83
    note: "Ladder is split across table classes; no single file holds the whole history. 'Web Data For Account' registers only AutofillSyncMetadataTable + PaymentsAutofillTable."
    source: {ref: ba3c200, path: components/webdata/common/web_database.h, lines: "35, 57"}
  Bookmarks:
    container: json
    version_field: version
    version_value: 1
    version_useful: false
    version_note: "Frozen at 1 for all of Chrome's history; exact-equality gate, no migration ladder. Discriminates nothing."
    also_applies_to: [Bookmarks.bak]
    integrity_note: "checksum (MD5) and checksum_sha256 (flagged) cover node id/title/url ONLY — timestamps are not covered. Editing date_added does not invalidate the checksum."
    source: {ref: ba3c200, path: components/bookmarks/browser/bookmark_codec.cc, lines: "41, 58-59, 105, 223-225, 131-135, 190-197"}
  Preferences:
    container: json
    version_field: none
    version_proxy: profile.created_by_version
    version_proxy_note: "A product version string, not a schema version."
    note: "A stratigraphic deposit, not a snapshot: keys are rewritten only when their owning component touches them."
    source: {ref: ba3c200, path: components/prefs/pref_service.cc, lines: "418-455"}
  Secure Preferences:
    container: json
    version_field: none
    generation_proxy: "install_time key present => pre-migration; first_install_time present => post-migration build has opened it"
    source: {ref: ba3c200, path: extensions/browser/extension_prefs.cc, lines: "197-200, 2556-2578"}
  Local State:
    container: json
    version_field: none
    source: {ref: ba3c200, path: components/prefs/pref_service.cc, lines: "418-455"}
  Media History:
    container: sqlite
    version_field: meta.version
    current_version: 6
    compatible_version: 1
    status: removed_from_chromium
    removed_between: [M120, M121]
    fossil: true
    fossil_note: "Chrome >= M121 neither creates nor updates it. A Media History file carries an implicit terminus ante quem for the profile and must never be reported as current activity."
    source: {ref: tag_120, path: chrome/browser/media/history/media_history_store.cc, lines: "32-33, 71-128"}
  Site Characteristics:
    container: leveldb
    payload: proto2-lite SiteDataProto
    version_field: none
    source: {ref: ba3c200, path: components/performance_manager/persistence/site_data/site_data.proto, lines: whole-file}
  Reporting and NEL:
    container: sqlite
    version_field: meta.version
    current_version: 2
    compatible_version: 2
    destructive_migration: "v1->v2 renames report_to -> group_name and back-fills nik with an empty NetworkAnonymizationKey, effectively clearing all policies. Absence of a policy after this point is NOT evidence the origin was not visited."
    source: {ref: ba3c200, path: net/extras/sqlite/sqlite_persistent_reporting_and_nel_store.cc, lines: "47-48, 702-730"}
  Trust Tokens:
    container: sqliteproto
    version_field: none
    generation_proxy: proto field-id presence
    note: "The only artifact in the corpus whose epoch is named in the persisted schema itself."
    source: {ref: ba3c200, path: services/network/trust_tokens/proto/public.proto, lines: "message Timestamp"}
  Affiliation Database:
    container: sqlite
    version_field: meta.version
    current_version: 7
    compatible_version: 1
    note: "Declarative SQLTableBuilder ladder; grepping for MigrateToVersion finds nothing here."
    source: {ref: ba3c200, path: components/affiliations/core/browser/affiliation_database.cc, lines: "36-41, 78-126"}
  Sessions:
    container: snss
    aka: [Session_*, Tabs_*, Last Session, Last Tabs]
    version_field: "file header int32 after signature 0x53534E53 ('SSNS')"
    supported_versions: [3, 5]
    rejected_versions: [1, 2, 4]
    version_useful_for_epoch: false
    version_note: "Container/encryption version, not a schema version. 1601-us at v3 and v5 alike. v5 is OSCrypt-encrypted."
    source: {ref: ba3c200, path: components/sessions/core/command_storage_backend.cc, lines: "46-64, 303-336"}
  Extension State:
    container: leveldb
    version_field: none
    note: "Extension-authored values; Chrome imposes no schema and writes no timestamp of its own. Do not apply Chrome epoch conventions here."
    source: {ref: ba3c200, path: extensions/browser/api/storage/, lines: not-read}

# Every one of these fires on FIRST OPEN by a modern Chrome. Strongest argument for
# the read-only Working Copy contract (#121).
destructive_on_open:
  - {artifact: History, effect: "razed below meta.version 15"}
  - {artifact: Top Sites, effect: "razed below meta.version 4"}
  - {artifact: Favicons, effect: "razed below meta.version 8"}
  - {artifact: Cookies, effect: "razed below meta.version 23"}
  - {artifact: Cookies, effect: "v19 rewrites expires_utc, capping to +400d — original expiry unrecoverable"}
  - {artifact: Web Data, effect: "razed at meta.version <= 82"}
  - {artifact: Web Data, effect: "on iOS, CleanupForCrbug445879524() deletes ALL credit_cards rows", source: {ref: ba3c200, path: components/autofill/core/browser/webdata/payments/payments_autofill_table.cc, lines: "1420-1425"}}
  - {artifact: DIPS, effect: "razed unless meta.version == 11"}
  - {artifact: Reporting and NEL, effect: "v1->v2 destroys policy validity"}
  - {artifact: Login Data, effect: "v<=8 date_created rewritten in place by the epoch migration"}
  - {artifact: History, effect: "v16->17 rewrites urls/visits/segment_usage times in place on non-Windows"}

# ---------------------------------------------------------------------------
# columns — the table proper. Keyed on (artifact, table, column).
# One row = one column at one artifact. version_range is on meta.version unless
# the row names another version_field. Each row carries its own Provenance.
# ---------------------------------------------------------------------------

columns:

# ===== History =========================================================

- id: history/urls/last_visit_time
  artifact: History
  table: urls
  column: last_visit_time
  declared_type: INTEGER NOT NULL
  kind: timestamp
  claim_state: verified
  epoch:
    - {version_range: {min: 17, max: null}, platform: any, family: win1601_us, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "706-719"}}
    - {version_range: {min: null, max: 16}, platform: windows, family: win1601_us, basis: verified,
       note: "MigrateTimeEpoch is compiled out on Windows; the bump is a documented NOP there.",
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "706-719"}}
    - {version_range: {min: null, max: 16}, platform: non_windows, family: unix_us, basis: verified,
       note: "Migration adds 11644473600000000 us, so the pre-state was Unix microseconds, not Unix seconds.",
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "1192-1208"}}
  ambiguity:
    state: requires_os_input
    applies_when: {version_range: {min: null, max: 16}}
    reason: "The version bumps on all platforms but the data is only rewritten off Windows. Nothing in meta, no column, and no SQLite header field records the originating OS."
    no_in_artifact_signal: true
    discriminators:
      - {kind: magnitude, basis: inferred, rule: "MAX(last_visit_time) < 1e16 => non-Windows Unix-us; > 1e17 => Windows 1601-us. Cannot overlap for any plausible 2008-2013 date.", emit_as: candidate}
      - {kind: sibling_column, basis: verified, rule: "downloads.full_path syntax: drive letter/backslashes => Windows; /Users/ or /home/ => non-Windows. Corroborates, never overrides.", emit_as: candidate,
         source: {ref: cb211f6, path: components/history/core/browser/download_database.cc, lines: "161"}}
    emit_when_unsupplied: unavailable
  boundary: {from_version: 16, to_version: 17, first_stable_milestone: M4, milestone_basis: "release-tag bisection 3.0.195.38 (v16, no migration) -> 4.0.249.78 (v17, migration present)", calendar_date: unresolved}
  sentinels:
    - {raw: 0, means: "never visited / unset", emit_as: absent, basis: verified,
       note: "The v16 migration's WHERE > 0 predicate preserves 0 as 0 in both epochs.",
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "1192-1208"}}
    - {raw: "<0", means: "not rebased by the migration; treat as corrupt", emit_as: unavailable, basis: verified}
  provenance:
    - {ref: cb211f6, path: components/history/core/browser/url_database.cc, lines: "735", claim: "schema: last_visit_time INTEGER NOT NULL"}
    - {ref: cb211f6, path: components/history/core/browser/url_database.cc, lines: "162, 192, 247", claim: "write sites, all BindTime"}
    - {ref: cb211f6, path: components/history/core/browser/url_database.cc, lines: "68", claim: "read site ColumnTime(5)"}
    - {ref: cb211f6, path: sql/statement.cc, lines: "41-45, 312, 529", claim: "BindTime/ColumnTime == 1601-us signed int64"}

- id: history/visits/visit_time
  artifact: History
  table: visits
  column: visit_time
  declared_type: INTEGER NOT NULL
  kind: timestamp
  claim_state: verified
  epoch:
    - {version_range: {min: 17, max: null}, platform: any, family: win1601_us, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "706-719"}}
    - {version_range: {min: null, max: 16}, platform: windows, family: win1601_us, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "706-719"}}
    - {version_range: {min: null, max: 16}, platform: non_windows, family: unix_us, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "1192-1208"}}
  ambiguity:
    state: requires_os_input
    applies_when: {version_range: {min: null, max: 16}}
    reason: "Same platform-conditional migration as urls.last_visit_time."
    no_in_artifact_signal: true
    same_as: history/urls/last_visit_time
    emit_when_unsupplied: unavailable
  boundary: {from_version: 16, to_version: 17, first_stable_milestone: M4}
  sentinels:
    - {raw: 0, means: "unset", emit_as: absent, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "1192-1208"}}
  provenance:
    - {ref: cb211f6, path: components/history/core/browser/visit_database.cc, lines: "155", claim: "schema: visit_time INTEGER NOT NULL"}
    - {ref: cb211f6, path: components/history/core/browser/visit_database.cc, lines: "393, 548", claim: "write sites BindTime"}
    - {ref: cb211f6, path: components/history/core/browser/visit_database.cc, lines: "273", claim: "read site ColumnTime(2)"}

- id: history/segment_usage/time_slot
  artifact: History
  table: segment_usage
  column: time_slot
  declared_type: INTEGER NOT NULL
  kind: timestamp
  claim_state: verified
  epoch:
    - {version_range: {min: 17, max: null}, platform: any, family: win1601_us, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/visitsegment_database.cc, lines: "231, 236, 254"}}
    - {version_range: {min: null, max: 16}, platform: windows, family: win1601_us, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "706-719"}}
    - {version_range: {min: null, max: 16}, platform: non_windows, family: unix_us, basis: verified,
       source: {ref: cb211f6, path: components/history/core/browser/history_database.cc, lines: "1192-1208"}}
  ambiguity:
    state: requires_os_input
    applies_when: {version_range: {min: null, max: 16}}
    reason: "Rewritten by the same MigrateTimeEpoch body."
    no_in_artifact_signal: true
    same_as: history/urls/last_visit_time
    emit_when_unsupplied: unavailable
  semantics:
    quantisation: one_day
    declared_timezone_interaction: local_midnight
    note: >-
      The CONTAINER is 1601-us UTC; the VALUE is midnight in the HOST's local timezone at write
      time (ts.LocalMidnight()). Rendering it as a UTC date shows the wrong calendar day for hosts
      east of UTC. Never present as a visit time. This falsifies #125's "no Chrome artifact stores
      local time" claim.
    derived_offset_rule: {expression: "time_slot % 86400000000", yields: "host UTC offset that day, incl. DST transitions", basis: inferred, emit_as: candidate, verification_queue: "part 1 VQ-9"}
  sentinels:
    - {raw: 0, means: unset, emit_as: absent, basis: verified}
  provenance:
    - {ref: cb211f6, path: components/history/core/browser/visitsegment_database.cc, lines: "132-136", claim: "schema"}
    - {ref: cb211f6, path: components/history/core/browser/visitsegment_database.cc, lines: "231", claim: "base::Time t = ts.LocalMidnight()"}
    - {ref: cb211f6, path: components/history/core/browser/visitsegment_database.cc, lines: "236, 254, 374", claim: "BindTime write sites"}

- id: history/visits/visit_duration
  artifact: History
  table: visits
  column: visit_duration
  declared_type: INTEGER DEFAULT 0 NOT NULL
  kind: duration
  claim_state: verified
  unit: microseconds
  never_date_render: true
  column_presence: {present_from: 21, present_to: null, added_by: "MigrateVisitsWithoutDuration() at meta.version 20->21"}
  sentinels:
