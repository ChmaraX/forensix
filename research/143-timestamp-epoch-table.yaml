- id: bookmarks/node/date_added
  artifact: Bookmarks
  table: "roots.*.children[]"
  column: date_added
  kind: timestamp
  claim_state: verified
  on_disk_shape: "JSON STRING, decimal"
  epoch:
    - {version_range: {min: null, max: null}, platform: any, family: win1601_us, basis: verified,
       source: {ref: ba3c200, path: components/bookmarks/browser/bookmark_codec.cc, lines: "183-184"}}
  version_field_useless: true
  version_field_note: "'version' is frozen at 1 forever. A file from 2012 and one from 2026 both say 1. Use key presence (date_last_used, guid, sync_metadata, checksum_sha256) as the generation proxy."
  parser_hazards:
    - "The read path uses FindString: an UNQUOTED JSON number is treated as ABSENT, not as a number."
    - "1.34e17 > 2^53. A consumer that coerces through IEEE-754 double quantises to ~16-32 us. Chrome writes a string, so a correct parser is lossless."
  synthetic:
    - applies_when: {condition: "date_added key missing at parse time (e.g. HTML import or third-party writer)"}
      written_by: ".value_or(base::Time::Now()) on decode, then written back on the next save"
      actually_records: "the time Chrome first parsed the file"
      not_evidence_of: "bookmark creation"
      indistinguishable_on_disk: true
      source: {ref: ba3c200, path: components/bookmarks/browser/bookmark_codec.cc, lines: "367-369, 383-386"}
  tamper_gap: "The checksum covers node id/title/url ONLY. Editing date_added does not invalidate it and Chrome will not detect the edit."
  provenance:
    - {ref: ba3c200, path: components/bookmarks/browser/bookmark_codec.cc, lines: "69-72", claim: "ToMicrosecondsSinceWindowsEpoch helper"}
    - {ref: ba3c200, path: components/bookmarks/browser/bookmark_codec.cc, lines: "75-88", claim: "FindMicrosecondsSinceWindowsEpoch decode path"}

