       source: {ref: cb211f6, path: components/history/core/browser/download_database.cc, lines: "610, 692, 701"}}
    - {version_range: {min: null, max: 23}, platform: any, family: unix_s, basis: verified,
       note: "Chromium's own comment names the pre-state: time_t, seconds since 1970-01-01 UTC. The migration adds 11644473600 SECONDS then scales by 1e6 — a different legacy epoch from urls/visits.",
       source: {ref: cb211f6, path: components/history/core/browser/download_database.cc, lines: "150-168"}}
