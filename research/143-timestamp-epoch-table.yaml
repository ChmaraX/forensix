- id: login-data/logins/date_created
  artifact: Login Data
  table: logins
  column: date_created
  declared_type: INTEGER NOT NULL
  kind: timestamp
  claim_state: verified
  epoch:
    - {version_range: {min: 9, max: null}, platform: any, family: win1601_us, basis: verified,
       source: {ref: cb211f6, path: components/password_manager/core/browser/password_store/login_database.cc, lines: "240, 1486, 1725"}}
    - {version_range: {min: null, max: 8}, platform: any, family: unix_s, basis: verified,
       note: "Migration: new = old_unix_seconds * kMicrosecondsPerSecond (1e6) + kMicrosecondsFromWindowsToUnixEpoch (11644473600000000). Both epochs UTC.",
       source: {ref: cb211f6, path: components/password_manager/core/browser/password_store/login_database.cc, lines: "822-832"}}
  platform_conditional: false
  platform_conditional_note: "Deliberately stated: there is NO #if BUILDFLAG around this block, in contrast to History v16. Do not over-generalise the History finding."
  boundary: {from_version: 8, to_version: 9, note: "v8 and v9 are schema-IDENTICAL. Version 9 exists solely to carry the epoch change — there is no column-presence tell; a parser MUST read meta.version.", first_stable_milestone: unresolved, verification_queue: "part 2 V-2"}
  ambiguity:
    state: version_field_untrusted
    applies_when: {version_range: {min: null, max: 8}}
    reason: >-
      Per crbug.com/295851 some Login Data files carry a WRONG meta.version. FixVersionIfNeeded
      repairs it by column sniffing. A file recording meta.version <= 8 but possessing a
      date_last_used column is really v25 and its date_created is 1601-us, not Unix seconds —
      wrong by 369 years on exactly the files where the epoch question is live.
    resolution_inputs: [column_presence_sniff, magnitude_check]
    required_procedure:
      - "Replicate FixVersionIfNeeded's ladder: logins.times_used => v3; logins.form_data => v4; logins.date_last_used => v25."
      - "Then magnitude-check date_created: 10 digits => unix_s; 18 digits => win1601_us."
      - "Never trust meta.version alone. Chrome itself does not magnitude-check, and would re-multiply an already-migrated value if the version were tampered down."
    emit_when_unsupplied: unavailable
    source: {ref: cb211f6, path: components/password_manager/core/browser/password_store/login_database.cc, lines: "914-950"}
  collision_warning: "Third of three columns named date_created in one profile: autofill.date_created (unix_s), password_notes.date_created (win1601_us), logins.date_created (version-dependent). Name-based dispatch is unsafe."
  provenance:
    - {ref: cb211f6, path: components/password_manager/core/browser/password_store/login_database.cc, lines: "387", claim: "column created at v0/v1"}
    - {ref: cb211f6, path: components/password_manager/core/browser/password_store/login_database.cc, lines: "423-427", claim: "SealVersion 8 and 9 with no column changes"}
    - {ref: cb211f6, path: base/time/time.h, lines: "411-412, 545-546", claim: "kMicrosecondsPerSecond, kMicrosecondsFromWindowsToUnixEpoch"}
  path_rot_note: "Issue #143's cited path components/password_manager/core/browser/login_database.cc is STALE (404); the file moved under password_store/."

